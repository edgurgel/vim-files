editor nvim

font_family      FiraCode Nerd Font
bold_font        FiraCode Nerd Font
italic_font      FiraCode Nerd Font
bold_italic_font FiraCode Nerd Font
font_size 17.0

tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_title_max_length 25
tab_title_template   {bell_symbol}{' ({})'.format(num_windows) if num_windows > 1 else ''} {title}
tab_activity_symbol = "";
tab_bar_margin_color #C6A0F6
tab_bar_margin_height 0.0 1.0
tab_bar_margin_width 0.0

visual_bell_color    #b8c0e0
visual_bell_duration 0.1

# Open windows, tabs and os windows with cwd
map kitty_mod+enter launch --cwd=current --type=window
map cmd+enter       launch --cwd=current --type=window
map kitty_mod+t     launch --cwd=current --type=tab
map cmd+t           launch --cwd=current --type=tab

# clear terminal
# map ctrl+k clear_terminal scrollback active
# map ctrl+k combine : clear_terminal scrollback active : send_text normal \x0c
map kitty_mod+backspace clear_terminal reset active

# A bit of a border between windows
window_border_width 3.0pt

# Nicer scrolling
map shift+page_up scroll_page_up
map shift+page_down scroll_page_down
map shift+home scroll_home
map shift+end scroll_end

# switch between tall and stack
# Tall:
# ┌──────────────┬───────────────┐
# │              │               │
# │              │               │
# │              │               │
# │              ├───────────────┤
# │              │               │
# │              │               │
# │              │               │
# │              ├───────────────┤
# │              │               │
# │              │               │
# │              │               │
# └──────────────┴───────────────┘
enabled_layouts tall,stack
map kitty_mod+z toggle_layout stack

# Go to specific tab
map kitty_mod+1 goto_tab 1

map kitty_mod+2 goto_tab 2
map kitty_mod+3 goto_tab 3
map kitty_mod+4 goto_tab 4
map kitty_mod+5 goto_tab 5
map kitty_mod+6 goto_tab 6
map kitty_mod+7 goto_tab 7
map kitty_mod+8 goto_tab 8
map kitty_mod+9 goto_tab 9
map kitty_mod+0 goto_tab 10

# Resize windows

map alt+shift+left resize_window narrower
map alt+shift+right resize_window wider
map alt+shift+up resize_window taller
map alt+shift+down resize_window shorter 3
# reset all windows in the tab to default sizes
map alt+shift+home resize_window reset

# Dim inactive panels
inactive_text_alpha 0.4

# Open any file with a fragment in vim, fragments are generated
# by the hyperlink-grep kitten or rg --hyperlink-format=kitty and nothing else so far.
protocol file
fragment_matches [0-9]+
action launch --type=overlay --cwd=current nvim +${FRAGMENT} -- ${FILE_PATH}

# Open text files without fragments in the editor
protocol file
mime text/*
action launch --type=overlay --cwd=current -- ${EDITOR} -- ${FILE_PATH}

# run "kitty +kitten themes"
# BEGIN_KITTY_THEME
# Catppuccin-Macchiato
include current-theme.conf
# END_KITTY_THEME

# Kitty + neovim
# https://github.com/mikesmithgh/kitty-scrollback.nvim
allow_remote_control yes
listen_on unix:/tmp/kitty
shell_integration enabled

# Generated with nvim --headless +'KittyScrollbackGenerateKittens'
# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten ${HOME}/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py

# Browse scrollback buffer in nvim
map kitty_mod+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
# Show clicked command output in nvim
mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

include ${KITTY_OS}.conf
